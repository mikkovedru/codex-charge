name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,tray,dev]"
          pytest tests/ -v

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
          powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/recharge-ai-task-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tray,dev]"
          pytest tests/ -v

      - name: Build Linux artifacts
        run: |
          bash scripts/build_linux.sh
          bash scripts/package_release.sh
          chmod +x dist/recharge-ai-task dist/recharge-ai-task-cli dist/recharge-ai-task-gui dist/recharge-ai-task-tray

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/recharge-ai-task-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES_v1.1.1.md
          files: |
            artifacts/windows-x86_64/recharge-ai-task-windows-x86_64.zip
            artifacts/linux-x86_64/recharge-ai-task-linux-x86_64.tar.gz
